services:
  - type: web
    name: ai-insights-api
    runtime: node
    buildCommand: bash build.sh
    startCommand: node --max-old-space-size=1536 dist/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    healthCheckPath: /health
    autoDeploy: true
